<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SQL Chatbot</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="subtitle">Start analyzing your data</p>
      
      {% if error %}
      <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/register">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" required placeholder="Harshitha Chintapalle">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="new-password" placeholder="••••••••" id="password">
          <small>At least 8 characters, include uppercase, number, and special character</small>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" required autocomplete="new-password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <div class="footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>
</body>
</html>
